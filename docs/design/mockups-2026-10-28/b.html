<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<title>B 에디토리얼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="base.css" />
<style>
  .tabbar a.on { background: transparent; color: #1a1816; }
  .tabbar a.on span { font-weight: 850; }
  .date { margin: 28px 0 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #8a8278; border-bottom: 1px solid #1a1816; padding-bottom: 10px; }
  .big { margin: 14px 0 0; font-size: 56px; line-height: 0.98; letter-spacing: -0.055em; font-weight: 300; }
  .big b { font-weight: 850; }
  .stage { position: relative; display: grid; place-items: end center; width: 270px; height: 330px; margin: 22px auto 0; border-radius: 135px 135px 0 0; background: linear-gradient(180deg, #f6f1ea, #eee5d8); }
  .stage::after { content: ""; position: absolute; bottom: 10px; left: 50%; width: 150px; height: 18px; transform: translateX(-50%); background: radial-gradient(ellipse, rgba(60,35,10,.28), transparent 70%); }
  .stage img { position: relative; z-index: 1; height: 290px; margin-bottom: 18px; }
  .name { margin-top: 18px; text-align: center; }
  .name small { display: block; font-size: 11.5px; font-weight: 750; letter-spacing: 0.16em; color: #8a8278; text-transform: uppercase; }
  .name h2 { margin: 6px 0 0; font-size: 28px; font-weight: 850; letter-spacing: -0.05em; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; border-top: 1px solid #e6e1da; border-bottom: 1px solid #e6e1da; }
  .facts div { padding: 12px 0; text-align: center; }
  .facts div + div { border-left: 1px solid #e6e1da; }
  .facts span { display: block; font-size: 11px; font-weight: 650; color: #8a8278; }
  .facts b { display: block; margin-top: 3px; font-size: 14px; font-weight: 800; letter-spacing: -0.03em; }
  .quote { margin: 18px 4px 0; font-size: 15px; line-height: 1.65; font-weight: 500; color: #4a443d; }
  .quote::before { content: "“"; display: block; height: 22px; font-size: 44px; line-height: 1; color: #c58a45; font-weight: 800; }
  .more { display: flex; align-items: center; justify-content: center; gap: 6px; height: 52px; margin-top: 18px; border-radius: 999px; background: #1a1816; color: #fff; font-size: 15px; font-weight: 750; }
  .sh { display: flex; align-items: baseline; justify-content: space-between; margin: 46px 0 4px; padding-bottom: 10px; border-bottom: 1px solid #1a1816; }
  .sh h3 { margin: 0; font-size: 13px; font-weight: 850; letter-spacing: 0.14em; }
  .sh h3 em { font-style: normal; color: #8a8278; font-weight: 600; margin-left: 8px; letter-spacing: 0; }
  .sh a { font-size: 13px; font-weight: 700; color: #6a635a; }
  .row { display: grid; grid-template-columns: 34px 54px 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee9e2; }
  .row .n { font-size: 22px; font-weight: 300; letter-spacing: -0.04em; color: #8a8278; }
  .row .th { display: grid; place-items: center; height: 66px; border-radius: 14px; background: #f6f2ec; }
  .row .th img { height: 56px; max-width: 46px; object-fit: contain; }
  .row b { display: block; font-size: 15.5px; font-weight: 800; letter-spacing: -0.035em; }
  .row small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; color: #7a7268; }
  .row .r { font-size: 13.5px; font-weight: 800; }
  .row .r em { font-style: normal; color: #b06f24; }
  .kinds { display: grid; grid-template-columns: 1fr 1fr; }
  .kinds a { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #eee9e2; }
  .kinds a:nth-child(odd) { padding-right: 12px; border-right: 1px solid #eee9e2; }
  .kinds a:nth-child(even) { padding-left: 14px; }
  .kinds i { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .kinds b { font-size: 15px; font-weight: 800; letter-spacing: -0.03em; }
  .kinds span { margin-left: auto; font-size: 12.5px; font-weight: 700; color: #8a8278; }
</style>
</head>
<body>
<main class="page" id="app"></main>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const t = W[TODAY];
  document.getElementById("app").innerHTML = `
  <div class="top">${brand(30)}<span class="me">${ic("user", 20)}</span></div>
  <p class="date"><span>10.28 TUE</span><span>1,116 WHISKIES</span></p>
  <p class="big">Today's<br/><b>Whisky</b></p>
  <div class="stage"><img class="bottle" src="${img(TODAY)}" alt="" /></div>
  <div class="name"><small>${t.en}</small><h2>${t.name}</h2></div>
  <div class="facts"><div><span>종류</span><b>${short(t.type)}</b></div><div><span>도수</span><b>${t.abv}</b></div><div><span>가격대</span><b>${PB[t.price]}</b></div><div><span>별점</span><b>★ ${t.rating}</b></div></div>
  <p class="quote">${t.note}</p>
  <a class="more">이 위스키 자세히 ${ic("arrow", 18, 2)}</a>
  <div class="sh"><h3>POPULAR<em>인기 위스키</em></h3><a>전체</a></div>
  ${POPULAR.slice(0, 5).map((k, i) => { const w = W[k]; return `<a class="row"><span class="n">0${i + 1}</span><span class="th"><img class="bottle" src="${img(k)}" alt=""/></span><span><b>${w.name}</b><small>${short(w.type)} · ${PB[w.price]}</small></span><span class="r"><em>★</em> ${w.rating}</span></a>`; }).join("")}
  <div class="sh"><h3>STYLES<em>종류로 둘러보기</em></h3><a>전체</a></div>
  <div class="kinds">${KINDS.map((k) => `<a><i style="background:${mix(k.c, 0.0, "#000")}"></i><b>${k.ko}</b><span>${k.n}</span></a>`).join("")}</div>
  ${tabs()}`;
</script>
</body>
</html>
