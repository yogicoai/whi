<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<title>C 컬러 벤토</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="base.css" />
<style>
  .tabbar a.on { background: #fbefdc; color: #93591a; }
  h1 { margin: 24px 0 18px; font-size: 30px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.24; }
  .bento { display: grid; gap: 10px; grid-template-columns: 1.12fr 1fr; grid-template-areas: "today count" "today golden" "pick golden" "pick jack" "search jack"; grid-template-rows: 128px 132px 70px 84px 64px; }
  .t { position: relative; overflow: hidden; border-radius: 26px; padding: 15px; }
  .today { grid-area: today; }
  .today .eb, .pick .eb { font-size: 11px; font-weight: 850; letter-spacing: 0.12em; color: rgba(40,20,0,.6); }
  .today img { position: absolute; left: 50%; top: 34px; height: 172px; transform: translateX(-50%); filter: drop-shadow(0 18px 14px rgba(90,45,0,.35)) drop-shadow(0 3px 3px rgba(90,45,0,.25)); }
  .today .glow { position: absolute; left: 50%; top: 40px; width: 200px; height: 200px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.6), transparent 66%); }
  .today .info { position: absolute; left: 15px; right: 15px; bottom: 14px; }
  .today h2 { margin: 0 0 4px; font-size: 20px; font-weight: 850; letter-spacing: -0.045em; }
  .today p { margin: 0; font-size: 12.5px; font-weight: 700; color: rgba(40,20,0,.66); }
  .count { grid-area: count; background: #1f1b17; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
  .count small { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #e3b56f; }
  .count b { font-size: 34px; font-weight: 850; letter-spacing: -0.05em; line-height: 1; }
  .count span { font-size: 13px; font-weight: 650; color: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: space-between; }
  .golden { grid-area: golden; background: #f6efe3; }
  .golden h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 16px; font-weight: 850; letter-spacing: -0.04em; color: #1a1816; }
  .golden h3 svg { color: #b06f24; }
  .golden li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13.5px; font-weight: 750; list-style: none; }
  .golden ol { margin: 0; padding: 0; }
  .golden li i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #fff; font-style: normal; font-size: 11.5px; font-weight: 850; }
  .golden li:first-child i { background: #a5651f; color: #fff; }
  .golden li em { margin-left: auto; font-style: normal; font-size: 12px; color: #93591a; font-weight: 800; }
  .pick { grid-area: pick; background: #dfe6d6; }
  .pick img { position: absolute; right: 8px; bottom: -14px; height: 128px; transform: rotate(6deg); }
  .pick b { position: absolute; left: 15px; bottom: 14px; max-width: 58%; font-size: 15px; font-weight: 850; letter-spacing: -0.04em; line-height: 1.3; }
  .jack { grid-area: jack; padding: 0; background: #e9ded2; }
  .jack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .jack span { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 16px; background: rgba(255,255,255,.75); backdrop-filter: blur(12px); font-size: 14px; font-weight: 850; }
  .jack span small { font-size: 12px; color: #93591a; font-weight: 800; }
  .search { grid-area: search; background: #f4f2ef; display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 750; color: #4a443d; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 14px; }
  .sec h3 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.04em; }
  .sec a { font-size: 13.5px; font-weight: 700; color: #6a635a; }
  .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kd { position: relative; height: 118px; padding: 14px; border-radius: 22px; overflow: hidden; }
  .kd b { display: block; font-size: 16px; font-weight: 850; letter-spacing: -0.035em; }
  .kd small { display: block; margin-top: 2px; max-width: 64%; font-size: 12px; font-weight: 650; line-height: 1.4; color: rgba(30,20,10,.66); }
  .kd i { position: absolute; left: 14px; bottom: 12px; font-style: normal; font-size: 12.5px; font-weight: 850; color: rgba(30,20,10,.72); }
  .kd img { position: absolute; right: 4px; bottom: -22px; height: 112px; transform: rotate(10deg); }
</style>
</head>
<body>
<main class="page" id="app"></main>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const t = W[TODAY];
  document.getElementById("app").innerHTML = `
  <div class="top">${brand(30)}<span class="me">${ic("user", 20)}</span></div>
  <h1>오늘은 어떤 위스키를<br/>마셔 볼까요?</h1>
  <div class="bento">
    <a class="t today" style="background:linear-gradient(170deg, ${mix(t.color, 0.35)}, ${t.color})"><span class="eb">TODAY</span><span class="glow"></span><img src="${img(TODAY)}" alt=""/><div class="info"><h2>${t.name}</h2><p>★ ${t.rating} · ${short(t.type)}</p></div></a>
    <a class="t count"><small>WHISKIES</small><b>1,116</b><span>종 둘러보기 ${ic("arrow", 16, 2)}</span></a>
    <div class="t golden"><h3>${ic("trophy", 18, 2)}황금레시피</h3><ol><li><i>1</i>위스키 하이볼<em>1:3</em></li><li><i>2</i>얼그레이 하이볼<em>1:4</em></li><li><i>3</i>가쿠 하이볼<em>1:4</em></li></ol></div>
    <a class="t pick"><span class="eb">REAL PICK</span><b>실제 제품으로 만드는 레시피</b><img class="bottle" src="${img("0")}" alt=""/></a>
    <a class="t jack"><img src="http://localhost:5710/drinks/cola-card.webp" alt=""/><span>잭콕<small>1 : 3</small></span></a>
    <a class="t search">${ic("search", 19)}위스키 찾기</a>
  </div>
  <div class="sec"><h3>종류로 둘러보기</h3><a>전체</a></div>
  <div class="kinds">${KINDS.slice(0, 6).map((k) => `<a class="kd" style="background:${mix(k.c, 0.25)}"><b>${k.ko}</b><small>${k.line}</small><i>${k.n}종</i><img class="bottle" src="${img(k.k)}" alt=""/></a>`).join("")}</div>
  ${tabs()}`;
</script>
</body>
</html>
