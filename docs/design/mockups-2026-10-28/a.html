<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390" />
<title>A 컬러 보틀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="base.css" />
<style>
  .over { margin: 26px 0 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #93591a; }
  h1 { margin: 0 0 18px; font-size: 30px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.24; }
  .search { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 18px; border-radius: 999px; background: #f4f2ef; color: #7a7268; font-size: 15px; font-weight: 600; }
  .hero { position: relative; height: 430px; margin-top: 16px; border-radius: 32px; overflow: hidden; }
  .hero .glow { position: absolute; width: 330px; height: 330px; right: -70px; top: 34px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 68%); }
  .hero .bottle { position: absolute; right: 26px; top: 46px; height: 300px; filter: drop-shadow(0 26px 22px rgba(90, 45, 0, 0.38)) drop-shadow(0 4px 4px rgba(90,45,0,.25)); }
  .hero .eb { position: absolute; left: 24px; top: 24px; font-size: 11.5px; font-weight: 850; letter-spacing: 0.14em; color: rgba(40, 20, 0, 0.62); }
  .hero .info { position: absolute; left: 24px; right: 24px; bottom: 24px; }
  .hero .en { font-size: 13px; font-weight: 700; color: rgba(40,20,0,.6); letter-spacing: -0.01em; }
  .hero h2 { margin: 2px 0 12px; font-size: 32px; font-weight: 850; letter-spacing: -0.05em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips span { padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.55); font-size: 13px; font-weight: 750; }
  .go { position: absolute; right: 22px; bottom: 22px; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #1a1816; color: #fff; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 38px 0 14px; }
  .sec h3 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.04em; }
  .sec a { font-size: 13.5px; font-weight: 700; color: #6a635a; }
  .kind { position: relative; flex: none; width: 148px; height: 196px; padding: 16px; border-radius: 26px; overflow: hidden; }
  .kind b { display: block; font-size: 17px; font-weight: 850; letter-spacing: -0.03em; }
  .kind small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 650; color: rgba(30,20,10,.62); }
  .kind i { position: absolute; left: 16px; bottom: 14px; font-style: normal; font-size: 12.5px; font-weight: 800; color: rgba(30,20,10,.7); }
  .kind img { position: absolute; right: -6px; bottom: -18px; height: 150px; transform: rotate(8deg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card .ph { position: relative; display: grid; place-items: end center; height: 200px; padding-bottom: 18px; border-radius: 24px; }
  .card .ph::after { content: ""; position: absolute; bottom: 14px; left: 50%; width: 70%; height: 14px; transform: translateX(-50%); background: radial-gradient(ellipse, rgba(60,35,10,.22), transparent 70%); }
  .card .ph img { position: relative; z-index: 1; max-width: 80%; height: 160px; object-fit: contain; }
  .card .rk { position: absolute; left: 12px; top: 12px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #fff; font-size: 12.5px; font-weight: 850; }
  .card h4 { margin: 10px 2px 2px; font-size: 15.5px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.3; }
  .card p { margin: 0 2px; font-size: 12.5px; font-weight: 600; color: #6a635a; }
  .card .st { margin-top: 3px; font-size: 12.5px; font-weight: 800; }
  .card .st em { font-style: normal; color: #b06f24; }
</style>
</head>
<body>
<main class="page" id="app"></main>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const t = W[TODAY];
  document.getElementById("app").innerHTML = `
  <div class="top">${brand(30)}<span class="me">${ic("user", 20)}</span></div>
  <p class="over">1,116 WHISKIES · 7 STYLES</p>
  <h1>오늘은 어떤 위스키를<br/>마셔 볼까요?</h1>
  <div class="search">${ic("search", 20)}위스키 이름으로 찾기</div>
  <a class="hero" style="display:block;background:linear-gradient(160deg, ${mix(t.color, -0.0)} 0%, ${mix(t.color, 0.12, "#8a4b10")} 100%)">
    <span class="glow"></span>
    <span class="eb">TODAY'S WHISKY</span>
    <img class="bottle" src="${img(TODAY)}" alt="" />
    <div class="info">
      <span class="en">${t.en}</span>
      <h2>${t.name}</h2>
      <div class="chips"><span>★ ${t.rating}</span><span>${short(t.type)}</span><span>${PB[t.price]}</span></div>
    </div>
    <span class="go">${ic("arrow", 22, 2)}</span>
  </a>
  <div class="sec"><h3>종류로 둘러보기</h3><a>전체</a></div>
  <div class="rail">${KINDS.map((k) => `<a class="kind" style="background:${k.c}"><b>${k.en}</b><small>${k.ko}</small><i>${k.n}종</i><img class="bottle" src="${img(k.k)}" alt=""/></a>`).join("")}</div>
  <div class="sec"><h3>인기 위스키</h3><a>전체</a></div>
  <div class="grid">${POPULAR.map((k, i) => { const w = W[k]; return `<a class="card"><div class="ph" style="background:${mix(w.color, 0.8)}"><span class="rk">${i + 1}</span><img class="bottle" src="${img(k)}" alt=""/></div><h4>${w.name}</h4><p>${short(w.type)} · ${PB[w.price]}</p><p class="st"><em>★ ${w.rating}</em> · 후기 ${w.reviews.toLocaleString()}</p></a>`; }).join("")}</div>
  ${tabs()}`;
</script>
</body>
</html>
